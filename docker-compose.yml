services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --port 4200"
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "echo 'Backend placeholder ready in /app' && tail -f /dev/null"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app

volumes:
  frontend_node_modules:
