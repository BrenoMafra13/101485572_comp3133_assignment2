<section class="page">
	<header class="topbar">
		<h1>Employee List</h1>
		<button type="button" (click)="logout()">Logout</button>
	</header>

	<div class="table-wrap">
		<table>
			<thead>
				<tr>
					<th>First Name</th>
					<th>Last Name</th>
					<th>Email</th>
				</tr>
			</thead>
			<tbody>
				@for (employee of employees(); track employee.id) {
					<tr>
						<td>{{ employee.firstName }}</td>
						<td>{{ employee.lastName }}</td>
						<td>{{ employee.email }}</td>
					</tr>
				}
			</tbody>
		</table>
	</div>
</section>
